name: Frontend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://api.trainflow.example
      EXPO_PUBLIC_SUPABASE_URL: https://example-project.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run test:security-dependencies
      - run: npm run typecheck --workspace @metrivum/mobile
      - run: npm test -- --project mobile-core
      # Metro bundles both platforms; native/device acceptance remains a separate release gate.
      - run: npm run export --workspace @metrivum/mobile
  web:
    runs-on: ubuntu-latest
    env:
      # Public, non-secret build values. Real environments set their own.
      VITE_SITE_URL: https://trainflow.example
      VITE_API_URL: http://localhost:5080
      VITE_SUPABASE_URL: https://example-project.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run test:security-dependencies
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:hosting
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/bodyparts3d-4.0/source
          key: bodyparts3d-${{ hashFiles('infra/anatomy/source-lock.json') }}
      - run: npm run build
      - run: python infra/anatomy/verify_assets.py
      - run: npm run storybook:build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - run: npm run e2e:coaching
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
