name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: trainflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MigrationDatabase: Host=127.0.0.1;Port=5432;Database=trainflow_test;Username=postgres;Password=local-ci-only
      TRAINFLOW_TEST_DATABASE: Host=127.0.0.1;Port=5432;Database=trainflow_test;Username=postgres;Password=local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: dotnet tool restore
      - run: dotnet restore --locked-mode
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run test:security-dependencies
      - run: dotnet build --no-restore
      - shell: pwsh
        run: ./infra/test-secret-scan.ps1
      - shell: pwsh
        run: ./infra/scan-secrets.ps1 -IncludeHistory
      - run: dotnet format whitespace --no-restore --verify-no-changes
      - run: dotnet run --no-build --project apps/api/Metrivum.Api -- --migrate
      - run: dotnet test --no-build --logger trx --results-directory TestResults
      - shell: pwsh
        run: ./infra/export-contracts.ps1 -NoBuild
      - run: git diff --exit-code -- contracts/generated
      - run: dotnet package list --vulnerable --include-transitive --format json > dependency-audit.json
      - shell: pwsh
        run: |
          $audit = Get-Content dependency-audit.json -Raw | ConvertFrom-Json
          if ($audit.projects.frameworks.topLevelPackages -or $audit.projects.frameworks.transitivePackages) { throw 'Vulnerable .NET dependencies detected.' }
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: TestResults
